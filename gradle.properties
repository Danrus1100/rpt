# Single target: Minecraft 26.3 (Fabric + NeoForge)
deps.mc=26.3
deps.fabric=0.19.5
deps.fapi=0.164.0+26.3
deps.neoforge=26.3.0.94
deps.rpf=1.4.9-beta
deps.evalex=3.6.0

pub.target.versions=26.3
pub.target.platforms=fabric neoforge

# NeoGradle disables the decompiler when CI=true, which makes neoFormSetup apply
# binary patches and neoFormPatch then applies the same source patches again.
# Keep the decompile pipeline enabled so local and CI publish builds are reproducible.
neogradle.subsystems.decompiler.enabled=true

# Required by modstitch-multiloader until NeoGradle handles shared source sets itself.
# https://github.com/neoforged/NeoGradle/pull/316
neogradle.subsystems.conventions.sourcesets.automatic-inclusion=false
neogradle.subsystems.conventions.runs.create-default-run-per-type=false
neogradle.subsystems.conventions.configurations.enabled=false
neogradle.subsystems.conventions.jarjar.create-main-jarjar=false
